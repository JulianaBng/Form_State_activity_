<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sample</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     
  <div class="container">
 
<div class="header-section">
    <h2>Get in touch</h2>
        <p>Fill out the form below and we'll get back to you.</p>
</div>
 
 
<div class="form-section">
<form action="#" method="POST">
 
<div class="form-row">
    <div class="form-group">
    <label for="first-name">First name</label>
        <input type="text" id="first-name" name="first_name" placeholder="Nicaila">
</div>
    <div class="form-group">
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" name="last_name" placeholder="Marie">
</div>
 
</div>
 
<div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="nicaila@example.com">
</div>
 
 
<div class="form-group">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="+1 555 000 0000">
</div>
 
 
<div class="form-group">
    <label for="company">Company</label>
    <input type="text" id="company" name="company" placeholder="Acme Inc.">
</div>
 
 
<div class="form-group">
    <label for="website">Website</label>
    <input type="url" id="website" name="website" placeholder="https://example.com">
</div>
 
 
<div class="form-row">
    <div class="form-group">
     <label for="dob">Date of birth</label>
        <input type="date" id="dob" name="dob">
</div>
<div class="form-group">
    <label for="budget">Budget</label>
        <input type="number" id="budget" name="budget" placeholder="1000">
</div>
</div>
 
 
<div class="form-group">
    <label for="country">Country</label>
    <select id="country" name="country">
        <option value="" disabled selected>Select a country</option>
        <option value="US">United States</option>
        <option value="PH">Philippines</option>
    </select>
</div>
 
 
<div class="form-group">
    <label for="topic">Topic</label>
    <select id="topic" name="topic">
        <option value="" disabled selected>Choose a topic</option>
        <option value="general">General</option>
    </select>
</div>
 
 
<div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" placeholder="Tell us more..."></textarea>
</div>
 
 
<div class="checkbox-group">
    <input type="checkbox" id="terms" name="terms">
    <label for="terms">I agree to the terms and conditions</label>
</div>
 
 
<button type="submit" class="submit-btn">Submit</button>
    </form>
    </div>
</div>
 
</body>
</html>
